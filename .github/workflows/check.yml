# Runs on every PR and every push to main.
# Lints for syntax errors and undefined and unused names (eslint.config.mjs), looks for copied code in the extension,
# scripts, tests and skill scripts (jscpd), runs the tests in tests/, checks that the version matches everywhere
# (scripts/version.cjs), and (on PRs) that the version was bumped when a .js or .css file changed.
# On PRs it also warns when index.js grows by more than 100 lines (see CLAUDE.md on where new code goes).
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install checkers
        run: npm install --no-save --no-package-lock --no-audit --no-fund eslint@9.15.0 globals@15.12.0 jscpd@4.0.5

      - name: Lint
        run: npx eslint .

      # Blocks of 5+ lines and 50+ tokens that appear twice. Every file is scanned, whatever its size.
      - name: Copied code
        run: npx jscpd --max-size 5mb --max-lines 100000 --min-tokens 50 --min-lines 5 --threshold 0 --reporters console --format javascript --pattern "{*.js,scripts/*.cjs,tests/*.mjs,.claude/skills/**/*.cjs}" .

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Version matches everywhere
        run: node scripts/version.cjs check

      - name: Core growth
        if: github.event_name == 'pull_request'
        run: |
          grew=$(git diff --numstat HEAD^1 HEAD -- index.js | awk '{print $1-$2}')
          echo "index.js grew by ${grew:-0} lines."
          if [ "${grew:-0}" -gt 100 ]; then
            msg="index.js grew by $grew lines. The PR summary should say why this stays in core (see docs/pr-checklist.md)."
            echo "::warning file=index.js,title=Core growth::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Version was bumped
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD | grep -E '^[^/]+\.(js|css)$' || true)
          if [ -z "$changed" ]; then echo "No .js or .css changes, so no bump needed."; exit 0; fi
          echo "Changed files:"; echo "$changed"
          node scripts/version.cjs bumped HEAD^1
