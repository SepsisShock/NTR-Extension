# Runs on every PR and every push to main.
# Checks that each .js file loads, that the version matches in all 6 places,
# and (on PRs) that the version was bumped when a .js or .css file changed.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Files load
        run: |
          failed=0
          for f in *.js; do
            cp "$f" "$RUNNER_TEMP/$f.mjs"
            if node --check "$RUNNER_TEMP/$f.mjs"; then echo "$f loads"; else echo "::error file=$f::$f has a syntax error and won't load."; failed=1; fi
          done
          exit $failed

      - name: Version matches in all 6 places
        run: |
          node -e '
            const fs = require("fs");
            const found = { "manifest.json": JSON.parse(fs.readFileSync("manifest.json", "utf8")).version };
            for (const [file, name] of [["index.js", "VERSION"], ["vn.js", "VN_VERSION"], ["map.js", "MAP_VERSION"], ["opening.js", "OP_VERSION"], ["preview.js", "PREVIEW_VERSION"]]) {
              const m = fs.readFileSync(file, "utf8").match(new RegExp(`const ${name} = .([0-9.]+).;`));
              found[file] = m ? m[1] : "(not found)";
            }
            for (const [file, v] of Object.entries(found)) console.log(`${file}: ${v}`);
            if (new Set(Object.values(found)).size !== 1) {
              console.log("::error::The version is not the same in all 6 places. Bump it in manifest.json, index.js, vn.js, map.js, opening.js and preview.js.");
              process.exit(1);
            }
          '

      - name: Version was bumped
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD | grep -E '^[^/]+\.(js|css)$' || true)
          if [ -z "$changed" ]; then echo "No .js or .css changes, so no bump needed."; exit 0; fi
          echo "Changed files:"; echo "$changed"
          git show HEAD^1:manifest.json > "$RUNNER_TEMP/main-manifest.json"
          node -e '
            const fs = require("fs");
            const base = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).version;
            const head = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version;
            console.log(`main: ${base}, this PR: ${head}`);
            const a = base.split(".").map(Number), b = head.split(".").map(Number);
            const diff = [0, 1, 2].map(i => (b[i] || 0) - (a[i] || 0)).find(d => d !== 0) || 0;
            if (diff <= 0) {
              console.log(`::error::A .js or .css file changed, but the version was not bumped. It is ${head}; main has ${base}.`);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/main-manifest.json"
